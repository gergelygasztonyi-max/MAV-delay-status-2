name: MÁV morning status

on:
  push:
    branches: [main]
    paths:
      - "mav_report.py"
      - ".github/workflows/mav-report.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run validation against current live data or create the morning report"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - morning
  schedule:
    # GitHub cron is UTC. Run at both candidate UTC times and gate by local time below.
    - cron: "30 4 * * 1-5"
    - cron: "30 5 * * 1-5"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate live API (on push or manual validation)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate')
        env:
          REPORT_MODE: validate
        run: python mav_report.py

      - name: Check local schedule time
        id: clock
        if: github.event_name == 'schedule'
        run: |
          local_time=$(TZ=Europe/Budapest date +%H:%M)
          echo "Europe/Budapest local time: $local_time"
          if [ "$local_time" = "06:30" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate morning report
        if: (github.event_name == 'schedule' && steps.clock.outputs.should_run == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning')
        env:
          REPORT_MODE: morning
        run: |
          python mav_report.py | tee report-console.md
          cat report-console.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report files
        if: always() && hashFiles('out/report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mav-delay-report
          path: |
            out/report.md
            out/report.json
          if-no-files-found: warn
          retention-days: 14
